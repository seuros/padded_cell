[workspace]
members = ["ext/padded_cell_native/core", "ext/padded_cell_native/ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
repository = "https://github.com/seuros/padded_cell"

[workspace.dependencies]
padded_cell = { path = "ext/padded_cell_native/core" }
magnus = { version = "0.9.2", default-features = false }
ruby-prism = "1.9.0"
deadline_machines = { package = "deadline-machines", version = "0.4.0", default-features = false }
supervisor_machines = { package = "supervisor-machines", version = "0.4.0", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
# The FFI crate reads Ruby strings in place (one allowed unsafe block).
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
needless_borrow = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
